<!doctype html>
<meta charset="utf-8">
<title>LifeOS Chat Sync</title>
<style>
  body{width:340px;margin:0;padding:16px;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f7f9fc}
  h1{font-size:18px;margin:0 0 4px}.muted{color:#667085;font-size:12px;line-height:1.4}
  label{display:block;margin-top:14px;font-size:12px;font-weight:600;color:#667085}
  input{box-sizing:border-box;width:100%;margin-top:5px;padding:9px;border:1px solid #d8dee9;border-radius:8px;background:white}
  button{width:100%;margin-top:14px;padding:10px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:650;cursor:pointer}
  button.secondary{background:#e8eefb;color:#2454b8}.status{margin-top:12px;white-space:pre-wrap;font-size:12px}.preview{max-height:130px;overflow:auto;margin-top:10px;padding:9px;background:white;border:1px solid #e5e9f0;border-radius:8px;font-size:11px;line-height:1.4}
</style>
<h1>NextPlan Sync</h1>
<div class="muted">只在你点击同步时读取当前 ChatGPT 会话，并发送到 NextPlan。</div>
<label for="endpoint">LifeOS API 地址</label>
<input id="endpoint" placeholder="http://localhost:8000/api/chat/sync">
<button id="preview" class="secondary">读取当前对话预览</button>
<div id="previewBox" class="preview" hidden></div>
<button id="sync">确认并同步到 LifeOS</button>
<div id="status" class="status"></div>
<script src="popup.js"></script>
